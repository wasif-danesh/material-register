# Render Blueprint: describes the hosted demo as code. Connecting this repository to
# Render creates all three resources below. Everything is on the free plan.
#
# The two URLs in this file assume Render gives the services the addresses
# <name>.onrender.com. If a name is already taken Render adds a suffix; update
# WEB_ORIGIN and VITE_API_URL to the real addresses and push again.

databases:
  - name: material-register-db
    plan: free
    region: singapore
    # The same major version as docker-compose.yml and CI.
    postgresMajorVersion: '17'
    databaseName: material_register

services:
  # The API: Express and tRPC.
  - type: web
    name: material-register-api
    runtime: node
    plan: free
    region: singapore
    # Only what runs in production. Node 24 runs the TypeScript directly, so there is
    # no compile step and no build tooling to install.
    buildCommand: npm ci --omit=dev
    # A separate pre-deploy step needs a paid plan, so migrations run at start instead.
    # Both commands are safe to repeat: migrations that already ran are skipped, and
    # the seed only fills an empty database.
    startCommand: npm run db:migrate && npm run db:seed -- --if-empty && npm start
    healthCheckPath: /health
    # Deploy a commit only after the GitHub Actions checks pass on it.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: material-register-db
          property: connectionString
      # The only address allowed to call the API from a browser (CORS).
      - key: WEB_ORIGIN
        value: https://material-register-web.onrender.com

  # The web app: static files on Render's CDN.
  - type: web
    name: material-register-web
    runtime: static
    # The build tools are dev dependencies, so they are included explicitly.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: web/build/client
    autoDeployTrigger: checksPass
    envVars:
      # Read at build time and compiled into the JavaScript.
      - key: VITE_API_URL
        value: https://material-register-api.onrender.com/trpc
    routes:
      # A single-page app: every path is served index.html, and React Router shows the
      # right page. Without this, refreshing /materials/42 would return a 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
