# Local Postgres only. The API and web app run on the host with npm scripts.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: material_register
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d material_register']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
